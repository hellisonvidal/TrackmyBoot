# ============================================================
# GRADLE PROPERTIES - TrackmyBoot
# ============================================================

# JVM Settings for Gradle Daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Parallel Execution
org.gradle.parallel=true

# Configuration Cache (experimental, speeds up builds)
org.gradle.configuration-cache=true

# Kotlin Daemon
kotlin.daemon.jvm.options=-Xmx2048m

# Android
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Build Cache
org.gradle.caching=true

# ============================================================
# VERSÕES (centralizadas no libs.versions.toml se usar TOML)
# ============================================================

# Se migrar para Version Catalog (libs.versions.toml), remova estas:
# agpVersion=8.5.0
# kotlinVersion=1.9.23
# composeCompilerVersion=1.5.11
# coreKtxVersion=1.12.0
# activityComposeVersion=1.9.0
# lifecycleVersion=2.7.0
# roomVersion=2.6.1
# navigationVersion=2.7.6
# hiltVersion=2.48
# retrofitVersion=2.11.0
# okhttpVersion=4.12.0
# kotlinxCoroutinesVersion=1.7.3
# kotlinxSerializationVersion=1.6.3
# coilVersion=2.6.0
# material3Version=1.3.0
# workManagerVersion=2.9.0

# ============================================================
# SIGNING (configure para release - NÃO COMITE CHAVES REAIS)
# ============================================================

# SIGNING_STORE_FILE=../keystore/release.keystore
# SIGNING_STORE_PASSWORD=your_store_password
# SIGNING_KEY_ALIAS=your_key_alias
# SIGNING_KEY_PASSWORD=your_key_password

# ============================================================
# FIREBASE / PLAY STORE (se usar)
# ============================================================

# FIREBASE_APP_ID=1:123456789:android:abcdef
# PLAY_STORE_SERVICE_ACCOUNT_JSON=../secrets/play-store.json

# ============================================================
# FEATURE FLAGS (para builds condicionais)
# ============================================================

# ENABLE_ANALYTICS=true
# ENABLE_CRASHLYTICS=true
# ENABLE_REMOTE_CONFIG=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
